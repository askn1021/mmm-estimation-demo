[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmm-estimation-demo"
version = "0.1.0"
description = "Bayesian media mix estimation on synthetic weekly data"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14", "pandas>=2.2", "matplotlib>=3.9", "nbformat>=5.10", "ipython>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
